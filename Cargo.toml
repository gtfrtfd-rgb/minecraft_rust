[package]
name = "minecraft_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "android-native-activity",
    "bevy_winit",
    "bevy_pbr",
    "bevy_ui",
    "bevy_ui_render",       # ← добавлено — отрисовка UI
    "default_font",          # ← добавлено — встроенный шрифт для текста
    "bevy_text",
    "bevy_gizmos",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_state",
    "bevy_log",
    "png",
    "hdr",
    "ktx2",
    "zstd_rust",
    "multi_threaded",
    "tonemapping_luts",
] }
noise = "0.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
virtual_joystick = { version = "2.8.0", features = ["serde"] }

[features]
default = ["desktop"]
desktop = []
mobile = []

[package.metadata.android]
package = "com.example.minecraft_rust"
apk_name = "MinecraftRust"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
target_sdk_version = 34
min_sdk_version = 24
assets = "assets"
resources = "android/res"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application]
label = "Minecraft Rust"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|keyboardHidden|screenSize"
orientation = "landscape"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "minecraft_rust"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "android/keystore.jks"
keystore_password = "android"
alias = "minecraft"
password = "android"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3